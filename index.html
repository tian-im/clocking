<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Announcer / 报时器</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="language-toggle">
      <button id="langToggle">中文</button>
    </div>

    <h1 id="appTitle">Time Announcer</h1>

    <div class="control-panel">
      <div class="time-section">
        <label id="startLabel">Start Time:</label>
        <select id="startHour">
          <option value="6">6:00</option>
          <option value="7">7:00</option>
          <option value="8" selected>8:00</option>
          <option value="9">9:00</option>
          <option value="10">10:00</option>
        </select>
      </div>

      <div class="time-section">
        <label id="endLabel">End Time:</label>
        <select id="endHour">
          <option value="18">18:00</option>
          <option value="19">19:00</option>
          <option value="20">20:00</option>
          <option value="21" selected>21:00</option>
          <option value="22">22:00</option>
        </select>
      </div>

      <div class="announce-section">
        <label id="announceLabel">Announce At:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="announceHour" name="announceType" value="hour">
            <label id="hourLabel" for="announceHour">Hourly</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="announceHalfHour" name="announceType" value="halfhour" checked>
            <label id="halfHourLabel" for="announceHalfHour">Half-hour</label>
          </div>
        </div>
      </div>
    </div>

    <button id="updateBtn">Update Settings</button>

    <div class="display-area">
      <div id="timeDisplay">--:--</div>
      <div id="status">Announcing current time...</div>
      <div id="scheduleInfo"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
