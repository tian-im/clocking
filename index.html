<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Announcer / 报时器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-md w-full max-w-md p-6">
    <div class="flex justify-end mb-4">
      <button id="langToggle" class="text-blue-600 hover:text-blue-800 focus:outline-none">中文</button>
    </div>

    <h1 id="appTitle" class="text-2xl font-bold text-center text-gray-800 mb-6">Time Announcer</h1>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="flex flex-col">
        <label id="startLabel" class="font-semibold text-gray-700 mb-1">Start Time:</label>
        <select id="startHour"
          class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="6">6:00</option>
          <option value="7">7:00</option>
          <option value="8" selected>8:00</option>
          <option value="9">9:00</option>
          <option value="10">10:00</option>
        </select>
      </div>

      <div class="flex flex-col">
        <label id="endLabel" class="font-semibold text-gray-700 mb-1">End Time:</label>
        <select id="endHour"
          class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="18">18:00</option>
          <option value="19">19:00</option>
          <option value="20">20:00</option>
          <option value="21" selected>21:00</option>
          <option value="22">22:00</option>
        </select>
      </div>

      <div class="col-span-2 flex flex-col">
        <label id="announceLabel" class="font-semibold text-gray-700 mb-1">Announce At:</label>
        <div class="flex justify-around bg-gray-50 border border-gray-300 rounded-md px-3 py-2">
          <div class="flex items-center">
            <input type="radio" id="announceHour" name="announceType" value="hour" class="mr-2">
            <label id="hourLabel" for="announceHour">Hourly</label>
          </div>
          <div class="flex items-center">
            <input type="radio" id="announceHalfHour" name="announceType" value="halfhour" checked class="mr-2">
            <label id="halfHourLabel" for="announceHalfHour">Half-hour</label>
          </div>
        </div>
      </div>
    </div>

    <button id="updateBtn"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200 mb-6">
      Update Settings
    </button>

    <div class="text-center">
      <div id="timeDisplay" class="text-4xl font-mono my-4">--:--</div>
      <div id="status" class="text-gray-600 mb-2">Announcing current time...</div>
      <div id="scheduleInfo" class="text-gray-500 text-sm"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
